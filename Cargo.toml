[workspace]
members = ["crates/qr", "crates/qr-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/nG7ypFxs/Tessipher"
repository = "https://github.com/nG7ypFxs/Tessipher"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
