[changelog]
header = """
# Changelog

Generated from Conventional Commits.

"""
body = """
{% if version %}\
## {{ version }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
{% if group != "Internal" %}\
### {{ group }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/nG7ypFxs/Tessipher/commit/{{ commit.id }}))
{% if commit.breaking_description %}
  {{ commit.breaking_description | replace(from="\n", to="\n  ") }}
{% endif %}\
{% endfor %}\
{% endif %}\
{% endfor %}
"""
trim = true
format = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
commit_parsers = [
  { field = "breaking", pattern = "true", group = "Breaking changes" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  # Keep release boundaries even when a release has only internal changes.
  # The template hides these entries; breaking changes match the first rule.
  { message = ".*", group = "Internal" },
]
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
topo_order = true
sort_commits = "oldest"
