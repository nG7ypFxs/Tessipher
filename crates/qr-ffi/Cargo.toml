[package]
name = "tessipher-ffi"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "repository-only C ABI for the Tessipher embedded QR decoder"
homepage.workspace = true
repository.workspace = true
readme = "README.md"

[lib]
name = "qr_ffi"
crate-type = ["rlib", "staticlib"]

[features]
default = ["host"]
host = []
micro-qr = ["tessipher/micro-qr"]
micro-qr-detect = ["micro-qr", "tessipher/micro-qr-detect"]

[dependencies]
tessipher = { version = "0.2.0", path = "../qr" }
