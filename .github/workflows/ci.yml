name: Rust and C verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host:
    strategy:
      matrix:
        rust: [1.85.1, stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.10.10"
          cache-dependency-glob: "tools/*.py"
      - run: uv run tools/c_format.py --check
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --release
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings -D missing_docs
      - run: uv run tools/c_smoke.py
      - run: python3 tools/cross_decode.py
      - run: cargo run -p qr --example fuzz_smoke --release
      - run: cargo run -p qr --example bench --release
      - run: python3 tools/generate_fixtures.py && git diff --exit-code -- fixtures/
      - run: python3 -m pip install segno==1.6.6
      - run: python3 tools/generate_segno_fixtures.py && git diff --exit-code -- fixtures/
  embedded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (formerly stable)
        with:
          toolchain: stable
          targets: thumbv6m-none-eabi, thumbv7em-none-eabi, wasm32-unknown-unknown
      - run: cargo build -p qr-core --target thumbv6m-none-eabi --release --locked
      - run: cargo build -p qr-ffi --no-default-features --target thumbv7em-none-eabi --release --locked
      - run: python3 tools/check_symbols.py
      - run: cargo check -p qr --target wasm32-unknown-unknown --locked
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master (formerly nightly)
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --locked
      - run: python3 tools/fuzz_seeds.py
      - run: cargo fuzz run payload -- -max_total_time=15
      - run: cargo fuzz run matrix -- -max_total_time=15
      - run: cargo fuzz run image -- -max_total_time=15
